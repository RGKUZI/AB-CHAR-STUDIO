name: Build A1 and B1 GLB models
on:
  push:
    branches: [main]
    paths:
      - build_models.py
      - .github/workflows/build-models.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model builder
        run: pip install numpy trimesh scipy
      - name: Generate GLBs
        run: python build_models.py
      - name: Commit GLBs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/A1_Nomad_Static.glb assets/B1_Nomad_Static.glb
          if ! git diff --cached --quiet; then
            git commit -m "Generate detailed static A1 and B1 prototypes"
            git push
          fi
